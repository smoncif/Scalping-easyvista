<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyVista — Dashboard Incidents</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="app-layout">

    <!-- ==================== SIDEBAR ==================== -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="brand-mark">EV</span>
        <span class="brand-name">EasyVista</span>
      </div>

      <nav class="sidebar-nav">
        <a class="nav-item active" href="#" data-view="dashboard" onclick="showView('dashboard');return false">Dashboard</a>
        <a class="nav-item" href="#" data-view="tickets"   onclick="showView('tickets');return false">Tickets</a>
      </nav>

      <div class="sidebar-footer">
        <span class="sidebar-version">v1.0</span>
      </div>
    </aside>

    <!-- ==================== MAIN ==================== -->
    <div class="main-wrapper">

      <!-- Page header -->
      <header class="page-header">
        <div>
          <h1 class="page-title">Dashboard</h1>
          <p class="page-subtitle">Supervision des incidents en temps réel</p>
        </div>
        <div class="header-actions">
          <div class="update-info">
            <span class="update-label">Mis à jour le</span>
            <span id="last-updated" class="update-value">—</span>
          </div>
          <button onclick="loadAllData()" class="refresh-btn">Actualiser</button>
        </div>
      </header>

      <!-- Filter bar -->
      <div class="filter-bar" id="filter-bar">
        <span class="filter-label">Filtrer par date de création</span>
        <div class="filter-inputs">
          <div class="date-input-group">
            <label for="date-from">Du</label>
            <input type="date" id="date-from" class="date-input">
          </div>
          <span class="date-sep">→</span>
          <div class="date-input-group">
            <label for="date-to">Au</label>
            <input type="date" id="date-to" class="date-input">
          </div>
        </div>
        <!-- TODO: temporaire — supprimer ce bloc avec le switch HENAUT -->
        <label class="filter-switch">
          <input type="checkbox" id="scope-exclude-henaut" onchange="applyFilters()">
          <span class="filter-switch-slider"></span>
          <span class="filter-switch-label">Exclure HENAUT, Nadège</span>
        </label>
        <button onclick="applyFilters()" class="filter-btn">Appliquer</button>
        <button onclick="resetFilters()" class="filter-reset">Réinitialiser</button>
        <div class="filter-tag hidden" id="filter-tag">
          <span id="filter-indicator"></span>
        </div>
      </div>

      <!-- Loading -->
      <div id="loading" class="loading-state">
        <div class="spinner"></div>
        <p>Chargement des données...</p>
      </div>

      <!-- Error -->
      <div id="error-state" class="hidden loading-state">
        <p id="error-msg" class="error-msg"></p>
        <button onclick="loadAllData()" class="refresh-btn" style="margin-top:14px">Réessayer</button>
      </div>

      <!-- Main content -->
      <main id="main-content" class="hidden">

        <!-- ========== VUE DASHBOARD ========== -->
        <div class="view-section" data-view="dashboard">

          <!-- KPI Cards -->
          <section class="section">
            <div class="kpi-grid" id="kpi-grid"></div>
          </section>

          <!-- Alert Badges -->
          <section class="section">
            <div class="alerts-row" id="alerts-row"></div>
          </section>

          <!-- Charts Row -->
          <section class="section">
            <div class="grid-2">
              <div class="card">
                <div class="card-title-row">
                  <h2 class="card-title">Tendance</h2>
                  <div class="toggle-btns">
                    <button id="btn-month" class="toggle-btn active" onclick="setTrendGranularity('month')">Mois</button>
                    <button id="btn-week"  class="toggle-btn"        onclick="setTrendGranularity('week')">Semaine</button>
                  </div>
                </div>
                <canvas id="monthly-chart"></canvas>
              </div>
              <div class="card">
                <h2 class="card-title">
                  Alertes Actives
                  <span id="active-alerts-count" class="alerts-pill"></span>
                </h2>
                <div id="alerts-table"></div>
              </div>
            </div>
          </section>

          <!-- Team Table -->
          <section class="section">
            <div class="card">
              <h2 class="card-title">Performance Équipe</h2>
              <div id="team-table" style="overflow-x:auto"></div>
            </div>
          </section>

          <!-- Distributions -->
          <section class="section">
            <div class="card">
              <h2 class="card-title">Distributions par Dimension</h2>
              <div id="distributions" class="distributions-grid"></div>
            </div>
          </section>

        </div><!-- /view-section dashboard -->

        <!-- ========== VUE TICKETS ========== -->
        <div class="view-section hidden" data-view="tickets">
          <section class="section">
            <div class="card">
              <h2 class="card-title">Liste des Tickets</h2>
              <div id="tickets-table"></div>
            </div>
          </section>
        </div><!-- /view-section tickets -->

      </main>
    </div>
  </div>

  <script src="js/dashboard.js"></script>
</body>
</html>
